<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalSend</title>
    <style>
        body {
            font-family: sans-serif, system-ui;
            margin: 0;
            line-height: 1.5;
            text-align: center;
        }

        a {
            text-decoration: none;
            color: #FFFFFF;
        }

        #file-list {
            box-sizing: border-box;
            width: 100%;
            max-width: 1000px;
            padding: 0 1em;
            margin: 0 auto;
            text-align: left;
            overflow: hidden;
        }

        .file-group-title {
            clear: both;
            font-weight: bold;
            padding: 0.5em 0;
            color: #424242;
        }

        .file-item {
            display: table;
            width: 100%;
            padding: 0.5em 1em;
            background-color: #00796B;
            border-radius: 0.5em;
            margin-bottom: 1em;
            float: left;
            box-sizing: border-box;
        }

        .file-item:hover {
            background-color: #009688;
        }

        .file-name-cell, .file-size-cell {
            display: table-cell;
            vertical-align: middle;
        }

        .file-name-cell {
            width: 100%;
            padding: 0 0.5em;
        }

        .file-size-cell {
            font-size: 0.8em;
            white-space: nowrap;
            color: #E0E0E0;
        }

        /* Two columns layout */
        .file-item {
            width: 100%;
        }

        @media screen and (min-width: 768px) {
            #file-list.file-item {
                width: 48%;
                margin-right: 2%;
            }
            #file-list.file-item:nth-child(2n) {
                margin-right: 0;
            }
        }

        /* Single file mode */

        #single-file {
            box-sizing: border-box;
            width: 100%;
            text-align: left;
            max-width: 400px;
            padding: 0 1em;
            margin: 0 auto;
        }
    </style>
</head>
<body>
<noscript>
    LocalSend requires JavaScript, which is currently disabled. Please enable it and try again.
</noscript>

<h1 style="padding: 0.5em">LocalSend</h1>
<p id="status-text"></p>
<div id="file-list"></div>
<div id="single-file"></div>

<script>
    // IMPORTANT: This script works in Internet Explorer 8!

    var BASE_URL = '/api/localsend/v2';

    var i18n = {};
    var sessionId = sessionStorage.getItem('sessionId');
    var queryParams = location.search.slice(1).split('&');
    var queryPin = null;

    // Parse query parameters manually for IE
    for (var i = 0; i < queryParams.length; i++) {
      var pair = queryParams[i].split('=');
      if (pair[0] === 'pin') {
        queryPin = decodeURIComponent(pair[1]);
        break;
      }
    }

    function firstRequestFiles() {
      document.getElementById('status-text').innerText = i18n.waiting;
      var initialUrl = BASE_URL + '/prepare-download';

      if (sessionId) {
        initialUrl += '?sessionId=' + encodeURIComponent(sessionId);
        if (queryPin) {
          initialUrl += '&pin=' + encodeURIComponent(queryPin);
        }
      } else if (queryPin) {
        initialUrl += '?pin=' + encodeURIComponent(queryPin);
      }

      makeRequest(initialUrl, 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(true);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function pinRequestFiles(firstAttempt) {
      var pin = prompt(i18n.enterPin + (firstAttempt ? '' : '\n' + i18n.invalidPin));
      if (!pin) {
        document.getElementById('status-text').innerText = i18n.invalidPin;
        return;
      }

      makeRequest(BASE_URL + '/prepare-download?pin=' + encodeURIComponent(pin), 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(false);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function makeRequest(url, method, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          callback(xhr);
        }
      };
      xhr.send();
    }

    function fetchI18n(then) {
      makeRequest('/i18n.json', 'GET', function (response) {
        if (response.status !== 200) {
          alert('Could not load translations. Please reload the page to try again.');
          return;
        }
        try {
          i18n = JSON.parse(response.responseText);
        } catch (e) {
          alert('Could not parse translations. Please reload the page to try again.');
          return;
        }
        then();
      });
    }

    function init() {
      fetchI18n(firstRequestFiles);
    }

    function handleSuccess(response) {
      var data = JSON.parse(response.responseText);
      var files = data.files;
      sessionId = data.sessionId;
      sessionStorage.setItem('sessionId', sessionId);

      document.getElementById('status-text').innerText = i18n.files + ' (' + getKeys(data.files).length + ')';

      // Handling file display
      handleFilesDisplay(files, sessionId);
    }

    function handleFilesDisplay(files, sessionId) {
      var fileKeys = getKeys(files);
      var urls = [];
      var items = [];
      for (var i = 0; i < fileKeys.length; i++) {
        var file = files[fileKeys[i]];
        var url = fileUrl(sessionId, fileKeys[i]);
        urls.push(url);
        items.push({
          group: fileGroup(file.fileType),
          html: '<a class="file-item" href="' + url + '">' +
              '<div class="file-name-cell">' + escapeHtml(file.fileName) + '</div>' +
              '<div class="file-size-cell">' + formatBytes(file.size) + '</div>' +
              '</a>'
        });
      }

      if (fileKeys.length === 1) {
        // A single file is downloaded only after clicking it.
        document.getElementById('single-file').innerHTML = items[0].html;
        return;
      }

      var html = '';
      if (fileKeys.length > 1) {
        html += '<a id="download-all" href="javascript:void(0)" style="display:inline-block;padding:0.5em 1.5em;background-color:#00796B;border-radius:0.5em;margin-bottom:1em;">' +
            escapeHtml(downloadAllText()) + '</a>';
      }

      // Group the files by type instead of showing one mixed list.
      var groups = ['image', 'video', 'pdf', 'text', 'apk', 'other'];
      for (var g = 0; g < groups.length; g++) {
        var groupHtml = '';
        var count = 0;
        for (var k = 0; k < items.length; k++) {
          if (items[k].group === groups[g]) {
            count++;
            groupHtml += items[k].html;
          }
        }
        if (count > 0) {
          html += '<div class="file-group-title">' + escapeHtml(groupText(groups[g])) + ' (' + count + ')</div>' + groupHtml;
        }
      }

      document.getElementById('file-list').innerHTML = html;

      var downloadAll = document.getElementById('download-all');
      if (downloadAll) {
        downloadAll.onclick = function () {
          // One download per second: browsers may ask for permission to
          // download multiple files, and the sender resolves each file lazily.
          for (var j = 0; j < urls.length; j++) {
            (function (url, delay) {
              setTimeout(function () {
                triggerDownload(url);
              }, delay);
            })(urls[j], j * 1000);
          }
        };
      }
    }

    function fileGroup(fileType) {
      // The sender transmits the type as MIME type (or as legacy enum name).
      var type = fileType || '';
      if (type.indexOf('image/') === 0 || type === 'image') {
        return 'image';
      }
      if (type.indexOf('video/') === 0 || type === 'video') {
        return 'video';
      }
      if (type === 'application/pdf' || type === 'pdf') {
        return 'pdf';
      }
      if (type.indexOf('text/') === 0 || type === 'text') {
        return 'text';
      }
      if (type === 'application/vnd.android.package-archive' || type === 'apk') {
        return 'apk';
      }
      return 'other';
    }

    function groupText(group) {
      var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      // Labels in the order of the groups array above.
      var translations = {
        'en': ['Images', 'Videos', 'PDF', 'Text', 'Apps', 'Other'],
        'zh': ['图片', '视频', 'PDF 文档', '文本', '应用', '其他'],
        'zh-tw': ['圖片', '影片', 'PDF 文件', '文字', '應用程式', '其他'],
        'zh-hk': ['圖片', '視頻', 'PDF 文件', '文字', '應用程式', '其他'],
        'ja': ['画像', '動画', 'PDF', 'テキスト', 'アプリ', 'その他'],
        'ko': ['이미지', '동영상', 'PDF', '텍스트', '앱', '기타'],
        'de': ['Bilder', 'Videos', 'PDF', 'Text', 'Apps', 'Sonstige'],
        'fr': ['Images', 'Vidéos', 'PDF', 'Texte', 'Applications', 'Autres'],
        'es': ['Imágenes', 'Vídeos', 'PDF', 'Texto', 'Aplicaciones', 'Otros'],
        'it': ['Immagini', 'Video', 'PDF', 'Testo', 'App', 'Altro'],
        'pt': ['Imagens', 'Vídeos', 'PDF', 'Texto', 'Aplicativos', 'Outros'],
        'ru': ['Изображения', 'Видео', 'PDF', 'Текст', 'Приложения', 'Другое'],
        'uk': ['Зображення', 'Відео', 'PDF', 'Текст', 'Додатки', 'Інше'],
        'pl': ['Obrazy', 'Filmy', 'PDF', 'Tekst', 'Aplikacje', 'Inne'],
        'tr': ['Resimler', 'Videolar', 'PDF', 'Metin', 'Uygulamalar', 'Diğer'],
        'ar': ['صور', 'فيديو', 'PDF', 'نصوص', 'تطبيقات', 'أخرى'],
        'vi': ['Hình ảnh', 'Video', 'PDF', 'Văn bản', 'Ứng dụng', 'Khác'],
        'id': ['Gambar', 'Video', 'PDF', 'Teks', 'Aplikasi', 'Lainnya'],
        'th': ['รูปภาพ', 'วิดีโอ', 'PDF', 'ข้อความ', 'แอป', 'อื่นๆ'],
        'hi': ['चित्र', 'वीडियो', 'PDF', 'टेक्स्ट', 'ऐप', 'अन्य']
      };
      var labels = translations[lang] || translations[lang.split('-')[0]] || translations['en'];
      var groups = ['image', 'video', 'pdf', 'text', 'apk', 'other'];
      for (var i = 0; i < groups.length; i++) {
        if (groups[i] === group) {
          return labels[i];
        }
      }
      return group;
    }

    function fileUrl(sessionId, fileId) {
      return BASE_URL + '/download?sessionId=' + encodeURIComponent(sessionId) + '&fileId=' + encodeURIComponent(fileId);
    }

    function triggerDownload(url) {
      // A hidden iframe starts the download without leaving this page.
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);
      setTimeout(function () {
        if (iframe.parentNode) {
          iframe.parentNode.removeChild(iframe);
        }
      }, 60000);
    }

    function downloadAllText() {
      var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      var translations = {
        'zh': '下载全部',
        'zh-cn': '下载全部',
        'zh-sg': '下载全部',
        'zh-tw': '下載全部',
        'zh-hk': '下載全部',
        'ja': 'すべてダウンロード',
        'ko': '모두 다운로드',
        'de': 'Alle herunterladen',
        'fr': 'Tout télécharger',
        'es': 'Descargar todo',
        'it': 'Scarica tutto',
        'pt': 'Baixar tudo',
        'ru': 'Скачать всё',
        'uk': 'Завантажити все',
        'pl': 'Pobierz wszystko',
        'tr': 'Tümünü indir',
        'ar': 'تنزيل الكل',
        'vi': 'Tải xuống tất cả',
        'id': 'Unduh semua',
        'th': 'ดาวน์โหลดทั้งหมด',
        'hi': 'सभी डाउनलोड करें'
      };
      return translations[lang] || translations[lang.split('-')[0]] || 'Download all';
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) {
        return '';
      }
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, function (m) { return map[m]; });
    }

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return bytes + ' B';
      } else if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB';
      } else if (bytes < 1024 * 1024 * 1024) {
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      } else {
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
      }
    }

    function getKeys(obj) {
      var keys = [];
      for (var key in obj) {
        keys.push(key);
      }
      return keys;
    }

    init();
</script>
</body>
</html>
