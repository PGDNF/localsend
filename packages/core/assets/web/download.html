<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalSend</title>
    <style>
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            margin: 0;
            line-height: 1.5;
            color: #16302B;
            background-color: #F3F8F6;
            background-image: radial-gradient(circle at 50% -10%, #FFFFFF 0%, #EAF4F1 55%, #F3F8F6 100%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #brand {
            padding: 1.4em 1em 0.4em;
            text-align: center;
        }

        #brand-mark {
            display: inline-block;
            vertical-align: middle;
            width: 1.5em;
            height: 1.5em;
            margin-right: 0.35em;
            color: #00796B;
        }

        #brand-mark svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #brand-name {
            display: inline-block;
            vertical-align: middle;
            font-size: 2em;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0B4F47;
        }

        #status-text {
            text-align: center;
            color: #6C817C;
            margin: 0.2em 0 0.8em;
            font-size: 0.95em;
        }

        #toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            box-sizing: border-box;
            width: 100%;
            max-width: 760px;
            margin: 0 auto 0.8em;
            padding: 0.6em 1em;
            text-align: center;
            background-color: rgba(243, 248, 246, 0.92);
            border-bottom: 1px solid #DCE8E4;
        }

        @supports (backdrop-filter: blur(6px)) {
            #toolbar {
                background-color: rgba(243, 248, 246, 0.7);
                backdrop-filter: blur(6px);
            }
        }

        .btn {
            display: inline-block;
            box-sizing: border-box;
            margin: 0.25em;
            padding: 0.55em 1.3em;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 600;
            line-height: 1.2;
            border-radius: 999px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background-color: #00796B;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: #00695C;
        }

        .btn-secondary {
            background-color: #FFFFFF;
            color: #00796B;
            border-color: #00796B;
        }

        .btn-secondary:hover {
            background-color: #E0F2F1;
        }

        .btn-ghost {
            background-color: transparent;
            color: #6C817C;
        }

        .btn-ghost:hover {
            color: #16302B;
            background-color: #E7EFEC;
        }

        .btn[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .sel-count {
            display: inline-block;
            margin: 0.25em 0.6em;
            font-size: 0.9em;
            font-weight: 700;
            color: #0B4F47;
            vertical-align: middle;
        }

        #file-list {
            box-sizing: border-box;
            width: 100%;
            max-width: 760px;
            padding: 0 1em 2em;
            margin: 0 auto;
            text-align: left;
        }

        .file-item {
            display: table;
            table-layout: fixed;
            width: 100%;
            box-sizing: border-box;
            padding: 0.7em 1em;
            margin-bottom: 0.6em;
            background-color: #FFFFFF;
            border: 1px solid #DCE8E4;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(11, 79, 71, 0.05);
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
        }

        .file-item:hover {
            border-color: #00796B;
            box-shadow: 0 4px 12px rgba(11, 79, 71, 0.12);
            transform: translateY(-1px);
        }

        .file-item.selected {
            background-color: #DCEFEB;
            border-color: #00796B;
        }

        .file-check, .file-icon, .file-name-cell, .file-size-cell {
            display: table-cell;
            vertical-align: middle;
        }

        .file-check {
            display: none;
            width: 2.2em;
            text-align: center;
        }

        body.select-mode .file-check {
            display: table-cell;
        }

        .check-box {
            display: inline-block;
            box-sizing: border-box;
            width: 1.4em;
            height: 1.4em;
            line-height: 1.3em;
            text-align: center;
            font-size: 0.95em;
            font-weight: 700;
            color: #FFFFFF;
            border: 2px solid #B6C7C2;
            border-radius: 6px;
            background-color: #FFFFFF;
            vertical-align: middle;
        }

        .file-item.selected .check-box {
            background-color: #00796B;
            border-color: #00796B;
        }

        .file-icon {
            width: 3.2em;
            text-align: center;
        }

        .ext-badge {
            display: inline-block;
            box-sizing: border-box;
            min-width: 2.6em;
            padding: 0.25em 0.35em;
            font-size: 0.62em;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-align: center;
            border-radius: 6px;
        }

        .ext-image { background-color: #E3F2E9; color: #2E7D4F; }
        .ext-video { background-color: #ECE7F6; color: #6A4FB3; }
        .ext-pdf   { background-color: #FBE7E7; color: #C0392B; }
        .ext-text  { background-color: #E4EEF9; color: #2C6EAF; }
        .ext-apk   { background-color: #E0F0EF; color: #00796B; }
        .ext-other { background-color: #ECEFF1; color: #5B6B73; }

        .file-name-cell {
            width: auto;
            padding: 0 0.7em;
            font-weight: 600;
            word-break: break-all;
        }

        .file-size-cell {
            width: 5.5em;
            font-size: 0.8em;
            white-space: nowrap;
            text-align: right;
            color: #6C817C;
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #EAF4F1;
        }

        ::-webkit-scrollbar-thumb {
            background: #B6C7C2;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00796B;
        }
    </style>
</head>
<body>
<noscript>
    LocalSend requires JavaScript, which is currently disabled. Please enable it and try again.
</noscript>

<div id="brand">
    <span id="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></span>
    <span id="brand-name">LocalSend</span>
</div>
<p id="status-text"></p>
<div id="toolbar"></div>
<div id="file-list"></div>

<script>
    // IMPORTANT: This script works in Internet Explorer 8!

    var BASE_URL = '/api/localsend/v2';

    var i18n = {};
    var sessionId = sessionStorage.getItem('sessionId');
    var queryParams = location.search.slice(1).split('&');
    var queryPin = null;

    // Parse query parameters manually for IE
    for (var i = 0; i < queryParams.length; i++) {
      var pair = queryParams[i].split('=');
      if (pair[0] === 'pin') {
        queryPin = decodeURIComponent(pair[1]);
        break;
      }
    }

    // Display state: a flat list of every file plus an optional selection mode.
    var allFiles = [];
    var selectMode = false;
    var rowEls = [];
    var boxEls = [];

    function firstRequestFiles() {
      document.getElementById('status-text').innerText = i18n.waiting;
      var initialUrl = BASE_URL + '/prepare-download';

      if (sessionId) {
        initialUrl += '?sessionId=' + encodeURIComponent(sessionId);
        if (queryPin) {
          initialUrl += '&pin=' + encodeURIComponent(queryPin);
        }
      } else if (queryPin) {
        initialUrl += '?pin=' + encodeURIComponent(queryPin);
      }

      makeRequest(initialUrl, 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(true);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function pinRequestFiles(firstAttempt) {
      var pin = prompt(i18n.enterPin + (firstAttempt ? '' : '\n' + i18n.invalidPin));
      if (!pin) {
        document.getElementById('status-text').innerText = i18n.invalidPin;
        return;
      }

      makeRequest(BASE_URL + '/prepare-download?pin=' + encodeURIComponent(pin), 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(false);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function makeRequest(url, method, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          callback(xhr);
        }
      };
      xhr.send();
    }

    function fetchI18n(then) {
      makeRequest('/i18n.json', 'GET', function (response) {
        if (response.status !== 200) {
          alert('Could not load translations. Please reload the page to try again.');
          return;
        }
        try {
          i18n = JSON.parse(response.responseText);
        } catch (e) {
          alert('Could not parse translations. Please reload the page to try again.');
          return;
        }
        then();
      });
    }

    function init() {
      fetchI18n(firstRequestFiles);
    }

    function handleSuccess(response) {
      var data = JSON.parse(response.responseText);
      var files = data.files;
      sessionId = data.sessionId;
      sessionStorage.setItem('sessionId', sessionId);

      document.getElementById('status-text').innerText = i18n.files + ' (' + getKeys(data.files).length + ')';

      // Handling file display
      handleFilesDisplay(files, sessionId);
    }

    function handleFilesDisplay(files, sessionId) {
      var fileKeys = getKeys(files);
      allFiles = [];
      for (var i = 0; i < fileKeys.length; i++) {
        var file = files[fileKeys[i]];
        allFiles.push({
          id: fileKeys[i],
          name: file.fileName,
          size: file.size,
          type: file.fileType,
          url: fileUrl(sessionId, fileKeys[i]),
          selected: false
        });
      }

      selectMode = false;
      document.body.className = '';
      renderList();

      // A single file is just clicked to download; selection only matters for several.
      if (allFiles.length > 1) {
        renderToolbar();
      } else {
        document.getElementById('toolbar').innerHTML = '';
      }
    }

    function renderList() {
      var html = '';
      for (var i = 0; i < allFiles.length; i++) {
        var f = allFiles[i];
        var group = fileGroup(f.type);
        var ext = fileExt(f.name);
        html += '<a class="file-item" id="file-row-' + i + '" href="' + f.url + '">' +
            '<span class="file-check"><span class="check-box" id="file-box-' + i + '"></span></span>' +
            '<span class="file-icon"><span class="ext-badge ext-' + group + '">' + escapeHtml(ext) + '</span></span>' +
            '<span class="file-name-cell">' + escapeHtml(f.name) + '</span>' +
            '<span class="file-size-cell">' + formatBytes(f.size) + '</span>' +
            '</a>';
      }
      document.getElementById('file-list').innerHTML = html;

      rowEls = [];
      boxEls = [];
      for (var j = 0; j < allFiles.length; j++) {
        (function (idx) {
          var row = document.getElementById('file-row-' + idx);
          rowEls[idx] = row;
          boxEls[idx] = document.getElementById('file-box-' + idx);
          row.onclick = function () {
            if (selectMode) {
              toggleRow(idx);
              return false;
            }
            // Browse mode: follow the link, which the server serves as an attachment.
          };
        })(j);
      }
    }

    function renderToolbar() {
      var bar = document.getElementById('toolbar');
      if (!selectMode) {
        bar.innerHTML =
            '<button type="button" id="btn-select" class="btn btn-secondary">' + escapeHtml(t('select')) + '</button>' +
            '<button type="button" id="btn-all" class="btn btn-primary">' + escapeHtml(t('downloadAll')) + '</button>';
        document.getElementById('btn-select').onclick = enterSelect;
        document.getElementById('btn-all').onclick = downloadAll;
        return;
      }

      var count = selectedCount();
      var allSelected = count === allFiles.length;
      bar.innerHTML =
          '<button type="button" id="btn-toggle-all" class="btn btn-secondary">' + escapeHtml(allSelected ? t('deselectAll') : t('selectAll')) + '</button>' +
          '<span class="sel-count">' + count + ' / ' + allFiles.length + '</span>' +
          '<button type="button" id="btn-download-sel" class="btn btn-primary"' + (count === 0 ? ' disabled' : '') + '>' + escapeHtml(t('downloadSelected')) + ' (' + count + ')</button>' +
          '<button type="button" id="btn-cancel" class="btn btn-ghost">' + escapeHtml(t('cancel')) + '</button>';
      document.getElementById('btn-toggle-all').onclick = toggleAll;
      document.getElementById('btn-cancel').onclick = cancelSelect;
      var dl = document.getElementById('btn-download-sel');
      dl.disabled = count === 0;
      dl.onclick = downloadSelected;
    }

    function updateRowVisual(idx) {
      var f = allFiles[idx];
      rowEls[idx].className = f.selected ? 'file-item selected' : 'file-item';
      boxEls[idx].innerHTML = f.selected ? '✓' : '';
    }

    function toggleRow(idx) {
      allFiles[idx].selected = !allFiles[idx].selected;
      updateRowVisual(idx);
      renderToolbar();
    }

    function selectedCount() {
      var count = 0;
      for (var i = 0; i < allFiles.length; i++) {
        if (allFiles[i].selected) {
          count++;
        }
      }
      return count;
    }

    function enterSelect() {
      selectMode = true;
      document.body.className = 'select-mode';
      renderToolbar();
    }

    function cancelSelect() {
      selectMode = false;
      document.body.className = '';
      for (var i = 0; i < allFiles.length; i++) {
        allFiles[i].selected = false;
        updateRowVisual(i);
      }
      renderToolbar();
    }

    function toggleAll() {
      var target = selectedCount() !== allFiles.length;
      for (var i = 0; i < allFiles.length; i++) {
        allFiles[i].selected = target;
        updateRowVisual(i);
      }
      renderToolbar();
    }

    function downloadAll() {
      var urls = [];
      for (var i = 0; i < allFiles.length; i++) {
        urls.push(allFiles[i].url);
      }
      downloadUrls(urls);
    }

    function downloadSelected() {
      var urls = [];
      for (var i = 0; i < allFiles.length; i++) {
        if (allFiles[i].selected) {
          urls.push(allFiles[i].url);
        }
      }
      downloadUrls(urls);
    }

    function downloadUrls(urls) {
      if (!urls.length) {
        return;
      }
      // One download per second: browsers may ask for permission to
      // download multiple files, and the sender resolves each file lazily.
      for (var j = 0; j < urls.length; j++) {
        (function (url, delay) {
          setTimeout(function () {
            triggerDownload(url);
          }, delay);
        })(urls[j], j * 1000);
      }
    }

    function fileGroup(fileType) {
      // The sender transmits the type as MIME type (or as legacy enum name).
      var type = fileType || '';
      if (type.indexOf('image/') === 0 || type === 'image') {
        return 'image';
      }
      if (type.indexOf('video/') === 0 || type === 'video') {
        return 'video';
      }
      if (type === 'application/pdf' || type === 'pdf') {
        return 'pdf';
      }
      if (type.indexOf('text/') === 0 || type === 'text') {
        return 'text';
      }
      if (type === 'application/vnd.android.package-archive' || type === 'apk') {
        return 'apk';
      }
      return 'other';
    }

    function fileExt(name) {
      var idx = name.lastIndexOf('.');
      if (idx <= 0 || idx === name.length - 1) {
        return 'FILE';
      }
      var ext = name.substring(idx + 1).toUpperCase();
      if (ext.length > 4) {
        ext = ext.substring(0, 4);
      }
      return ext;
    }

    function t(key) {
      var lang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
      var translations = {
        'en': { select: 'Select', downloadAll: 'Download all', selectAll: 'Select all', deselectAll: 'Deselect all', downloadSelected: 'Download selected', cancel: 'Cancel' },
        'zh': { select: '选择', downloadAll: '下载全部', selectAll: '全选', deselectAll: '取消全选', downloadSelected: '下载选中', cancel: '取消' },
        'zh-tw': { select: '選擇', downloadAll: '下載全部', selectAll: '全選', deselectAll: '取消全選', downloadSelected: '下載選取', cancel: '取消' },
        'zh-hk': { select: '選擇', downloadAll: '下載全部', selectAll: '全選', deselectAll: '取消全選', downloadSelected: '下載選取', cancel: '取消' },
        'ja': { select: '選択', downloadAll: 'すべてダウンロード', selectAll: 'すべて選択', deselectAll: '選択解除', downloadSelected: '選択をダウンロード', cancel: 'キャンセル' },
        'ko': { select: '선택', downloadAll: '모두 다운로드', selectAll: '모두 선택', deselectAll: '선택 해제', downloadSelected: '선택 다운로드', cancel: '취소' },
        'de': { select: 'Auswählen', downloadAll: 'Alle herunterladen', selectAll: 'Alle auswählen', deselectAll: 'Auswahl aufheben', downloadSelected: 'Auswahl herunterladen', cancel: 'Abbrechen' },
        'fr': { select: 'Sélectionner', downloadAll: 'Tout télécharger', selectAll: 'Tout sélectionner', deselectAll: 'Tout désélectionner', downloadSelected: 'Télécharger la sélection', cancel: 'Annuler' },
        'es': { select: 'Seleccionar', downloadAll: 'Descargar todo', selectAll: 'Seleccionar todo', deselectAll: 'Deseleccionar todo', downloadSelected: 'Descargar selección', cancel: 'Cancelar' },
        'it': { select: 'Seleziona', downloadAll: 'Scarica tutto', selectAll: 'Seleziona tutto', deselectAll: 'Deseleziona tutto', downloadSelected: 'Scarica selezione', cancel: 'Annulla' },
        'pt': { select: 'Selecionar', downloadAll: 'Baixar tudo', selectAll: 'Selecionar tudo', deselectAll: 'Desmarcar tudo', downloadSelected: 'Baixar seleção', cancel: 'Cancelar' },
        'ru': { select: 'Выбрать', downloadAll: 'Скачать всё', selectAll: 'Выбрать всё', deselectAll: 'Снять выбор', downloadSelected: 'Скачать выбранное', cancel: 'Отмена' },
        'uk': { select: 'Вибрати', downloadAll: 'Завантажити все', selectAll: 'Вибрати все', deselectAll: 'Зняти вибір', downloadSelected: 'Завантажити вибране', cancel: 'Скасувати' },
        'pl': { select: 'Wybierz', downloadAll: 'Pobierz wszystko', selectAll: 'Zaznacz wszystko', deselectAll: 'Odznacz wszystko', downloadSelected: 'Pobierz zaznaczone', cancel: 'Anuluj' },
        'tr': { select: 'Seç', downloadAll: 'Tümünü indir', selectAll: 'Tümünü seç', deselectAll: 'Seçimi kaldır', downloadSelected: 'Seçilenleri indir', cancel: 'İptal' },
        'ar': { select: 'تحديد', downloadAll: 'تنزيل الكل', selectAll: 'تحديد الكل', deselectAll: 'إلغاء التحديد', downloadSelected: 'تنزيل المحدد', cancel: 'إلغاء' },
        'vi': { select: 'Chọn', downloadAll: 'Tải xuống tất cả', selectAll: 'Chọn tất cả', deselectAll: 'Bỏ chọn tất cả', downloadSelected: 'Tải mục đã chọn', cancel: 'Hủy' },
        'id': { select: 'Pilih', downloadAll: 'Unduh semua', selectAll: 'Pilih semua', deselectAll: 'Batal pilih semua', downloadSelected: 'Unduh yang dipilih', cancel: 'Batal' },
        'th': { select: 'เลือก', downloadAll: 'ดาวน์โหลดทั้งหมด', selectAll: 'เลือกทั้งหมด', deselectAll: 'ยกเลิกการเลือก', downloadSelected: 'ดาวน์โหลดที่เลือก', cancel: 'ยกเลิก' },
        'hi': { select: 'चुनें', downloadAll: 'सभी डाउनलोड करें', selectAll: 'सभी चुनें', deselectAll: 'चयन हटाएँ', downloadSelected: 'चयनित डाउनलोड करें', cancel: 'रद्द करें' }
      };
      var table = translations[lang] || translations[lang.split('-')[0]] || translations['en'];
      return table[key] || translations['en'][key] || key;
    }

    function fileUrl(sessionId, fileId) {
      return BASE_URL + '/download?sessionId=' + encodeURIComponent(sessionId) + '&fileId=' + encodeURIComponent(fileId);
    }

    function triggerDownload(url) {
      // A hidden iframe starts the download without leaving this page.
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);
      setTimeout(function () {
        if (iframe.parentNode) {
          iframe.parentNode.removeChild(iframe);
        }
      }, 60000);
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) {
        return '';
      }
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, function (m) { return map[m]; });
    }

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return bytes + ' B';
      } else if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB';
      } else if (bytes < 1024 * 1024 * 1024) {
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      } else {
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
      }
    }

    function getKeys(obj) {
      var keys = [];
      for (var key in obj) {
        keys.push(key);
      }
      return keys;
    }

    init();
</script>
</body>
</html>
