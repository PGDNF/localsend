<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalSend</title>
    <style>
        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            margin: 0;
            line-height: 1.5;
            color: #16302B;
            background-color: #F3F8F6;
            background-image: radial-gradient(circle at 50% -10%, #FFFFFF 0%, #EAF4F1 55%, #F3F8F6 100%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        #brand {
            padding: 1.4em 1em 0.4em;
            text-align: center;
        }

        #brand-mark {
            display: inline-block;
            vertical-align: middle;
            width: 1.5em;
            height: 1.5em;
            margin-right: 0.35em;
            color: #00796B;
        }

        #brand-mark svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        #brand-name {
            display: inline-block;
            vertical-align: middle;
            font-size: 2em;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #0B4F47;
        }

        #status-text {
            text-align: center;
            color: #6C817C;
            margin: 0.2em 0 0.8em;
            font-size: 0.95em;
        }

        #toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            box-sizing: border-box;
            width: 100%;
            max-width: 760px;
            margin: 0 auto 0.4em;
            padding: 0.6em 1em;
            text-align: center;
            background-color: rgba(243, 248, 246, 0.92);
            border-bottom: 1px solid #DCE8E4;
        }

        @supports (backdrop-filter: blur(6px)) {
            #toolbar {
                background-color: rgba(243, 248, 246, 0.7);
                backdrop-filter: blur(6px);
            }
        }

        .btn {
            display: inline-block;
            box-sizing: border-box;
            margin: 0.25em;
            padding: 0.55em 1.3em;
            font-family: inherit;
            font-size: 0.95em;
            font-weight: 600;
            line-height: 1.2;
            border-radius: 999px;
            border: 2px solid transparent;
            cursor: pointer;
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        .btn:active {
            transform: translateY(1px);
        }

        .btn-primary {
            background-color: #00796B;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: #00695C;
        }

        .btn-secondary {
            background-color: #FFFFFF;
            color: #00796B;
            border-color: #00796B;
        }

        .btn-secondary:hover {
            background-color: #E0F2F1;
        }

        .btn-ghost {
            background-color: transparent;
            color: #6C817C;
        }

        .btn-ghost:hover {
            color: #16302B;
            background-color: #E7EFEC;
        }

        .btn[disabled] {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .sel-count {
            display: inline-block;
            margin: 0.25em 0.6em;
            font-size: 0.9em;
            font-weight: 700;
            color: #0B4F47;
            vertical-align: middle;
        }

        #file-list {
            box-sizing: border-box;
            width: 100%;
            max-width: 760px;
            padding: 0 1em 2em;
            margin: 0 auto;
            text-align: left;
        }

        .group-header {
            display: table;
            table-layout: fixed;
            width: 100%;
            box-sizing: border-box;
            padding: 0.5em 1em 0.45em;
            margin: 1.1em 0 0.55em;
            border-bottom: 1px solid #DCE8E4;
        }

        .group-header:first-child {
            margin-top: 0.3em;
        }

        body.select-mode .group-header {
            cursor: pointer;
        }

        .group-check, .group-title-cell {
            display: table-cell;
            vertical-align: middle;
        }

        .group-check {
            display: none;
            width: 2.2em;
            text-align: center;
        }

        body.select-mode .group-check {
            display: table-cell;
        }

        .group-title-cell {
            width: auto;
        }

        .group-badge {
            font-size: 0.72em;
            padding: 0.3em 0.7em;
            max-width: 12em;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            vertical-align: middle;
        }

        .group-count {
            display: inline-block;
            margin-left: 0.6em;
            font-size: 0.8em;
            font-weight: 700;
            color: #6C817C;
            vertical-align: middle;
        }

        .group-header.group-all .check-box {
            background-color: #00796B;
            border-color: #00796B;
            color: #FFFFFF;
        }

        .group-header.group-partial .check-box {
            background-color: #FFFFFF;
            border-color: #00796B;
            color: #00796B;
        }

        .file-item {
            display: table;
            table-layout: fixed;
            width: 100%;
            box-sizing: border-box;
            padding: 0.7em 1em;
            margin-bottom: 0.6em;
            background-color: #FFFFFF;
            border: 1px solid #DCE8E4;
            border-radius: 12px;
            box-shadow: 0 1px 2px rgba(11, 79, 71, 0.05);
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease, transform 0.1s ease;
        }

        .file-item:hover {
            border-color: #00796B;
            box-shadow: 0 4px 12px rgba(11, 79, 71, 0.12);
            transform: translateY(-1px);
        }

        .file-item.selected {
            background-color: #DCEFEB;
            border-color: #00796B;
        }

        .file-check, .file-icon, .file-name-cell, .file-size-cell {
            display: table-cell;
            vertical-align: middle;
        }

        .file-check {
            display: none;
            width: 2.2em;
            text-align: center;
        }

        body.select-mode .file-check {
            display: table-cell;
        }

        .check-box {
            display: inline-block;
            box-sizing: border-box;
            width: 1.4em;
            height: 1.4em;
            line-height: 1.3em;
            text-align: center;
            font-size: 0.95em;
            font-weight: 700;
            color: #FFFFFF;
            border: 2px solid #B6C7C2;
            border-radius: 6px;
            background-color: #FFFFFF;
            vertical-align: middle;
        }

        .file-item.selected .check-box {
            background-color: #00796B;
            border-color: #00796B;
        }

        .file-icon {
            width: 3.2em;
            text-align: center;
        }

        .file-icon svg {
            display: inline-block;
            width: 1.5em;
            height: 1.5em;
            vertical-align: middle;
        }

        .cat-image { color: #2E7D4F; }
        .cat-video { color: #6A4FB3; }
        .cat-audio { color: #B26A00; }
        .cat-pdf   { color: #C0392B; }
        .cat-text  { color: #2C6EAF; }
        .cat-apk   { color: #00796B; }
        .cat-archive { color: #5B6B73; }
        .cat-other { color: #5B6B73; }

        .ext-badge {
            display: inline-block;
            box-sizing: border-box;
            min-width: 2.6em;
            padding: 0.25em 0.35em;
            font-size: 0.62em;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-align: center;
            border-radius: 6px;
        }

        .ext-image { background-color: #E3F2E9; color: #2E7D4F; }
        .ext-video { background-color: #ECE7F6; color: #6A4FB3; }
        .ext-audio { background-color: #FBF0DC; color: #B26A00; }
        .ext-pdf   { background-color: #FBE7E7; color: #C0392B; }
        .ext-text  { background-color: #E4EEF9; color: #2C6EAF; }
        .ext-apk   { background-color: #E0F0EF; color: #00796B; }
        .ext-archive { background-color: #ECEFF1; color: #5B6B73; }
        .ext-other { background-color: #ECEFF1; color: #5B6B73; }

        .file-name-cell {
            width: auto;
            padding: 0 0.7em;
            font-weight: 600;
            word-break: break-all;
        }

        .file-size-cell {
            width: 5.5em;
            font-size: 0.8em;
            white-space: nowrap;
            text-align: right;
            color: #6C817C;
        }

        @keyframes ls-rise {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .file-item, .group-header {
            animation: ls-rise 0.3s ease backwards;
        }

        @media (prefers-reduced-motion: reduce) {
            .file-item, .group-header {
                animation: none;
            }
        }

        ::-webkit-scrollbar {
            width: 10px;
        }

        ::-webkit-scrollbar-track {
            background: #EAF4F1;
        }

        ::-webkit-scrollbar-thumb {
            background: #B6C7C2;
            border-radius: 999px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #00796B;
        }
    </style>
</head>
<body>
<noscript>
    LocalSend requires JavaScript, which is currently disabled. Please enable it and try again.
</noscript>

<div id="brand">
    <span id="brand-mark"><svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/></svg></span>
    <span id="brand-name">LocalSend</span>
</div>
<p id="status-text"></p>
<div id="toolbar"></div>
<div id="file-list"></div>

<script>
    // IMPORTANT: This script works in Internet Explorer 8!

    var BASE_URL = '/api/localsend/v2';

    var FILE_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg"><path d="M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13z"/></svg>';

    // Maps a file extension to a colour category. The grouping key is the exact
    // extension; the category only drives the badge / icon colour.
    var EXT_CAT = {
        jpg: 'image', jpeg: 'image', png: 'image', gif: 'image', bmp: 'image', webp: 'image', svg: 'image', heic: 'image', heif: 'image', avif: 'image', tif: 'image', tiff: 'image', ico: 'image', raw: 'image',
        mp4: 'video', mkv: 'video', avi: 'video', mov: 'video', webm: 'video', flv: 'video', wmv: 'video', m4v: 'video', mpg: 'video', mpeg: 'video', '3gp': 'video', ts: 'video', m2ts: 'video',
        mp3: 'audio', flac: 'audio', wav: 'audio', aac: 'audio', ogg: 'audio', m4a: 'audio', wma: 'audio', opus: 'audio', ape: 'audio', alac: 'audio', aiff: 'audio', mid: 'audio', midi: 'audio', amr: 'audio',
        pdf: 'pdf',
        txt: 'text', md: 'text', log: 'text', csv: 'text', json: 'text', xml: 'text', yaml: 'text', yml: 'text', ini: 'text', conf: 'text', cfg: 'text', srt: 'text', ass: 'text', vtt: 'text', html: 'text', htm: 'text', css: 'text', js: 'text', ts: 'text', dart: 'text', py: 'text', java: 'text', c: 'text', cpp: 'text', h: 'text', hpp: 'text', rs: 'text', go: 'text', sh: 'text', bat: 'text', ps1: 'text', sql: 'text',
        apk: 'apk',
        zip: 'archive', rar: 'archive', '7z': 'archive', tar: 'archive', gz: 'archive', bz2: 'archive', xz: 'archive', tgz: 'archive', iso: 'archive', dmg: 'archive'
    };

    var i18n = {};
    var sessionId = sessionStorage.getItem('sessionId');
    var queryParams = location.search.slice(1).split('&');
    var queryPin = null;

    // Parse query parameters manually for IE
    for (var i = 0; i < queryParams.length; i++) {
      var pair = queryParams[i].split('=');
      if (pair[0] === 'pin') {
        queryPin = decodeURIComponent(pair[1]);
        break;
      }
    }

    // Display state: every file is grouped by its extension. Selection mode
    // works across all groups; a group header toggles its whole group.
    var allFiles = [];
    var selectMode = false;
    var rowEls = [];
    var boxEls = [];
    var groups = {};
    var groupOrder = [];
    var groupHeadEls = {};
    var groupBoxEls = {};

    function firstRequestFiles() {
      document.getElementById('status-text').innerText = i18n.waiting;
      var initialUrl = BASE_URL + '/prepare-download';

      if (sessionId) {
        initialUrl += '?sessionId=' + encodeURIComponent(sessionId);
        if (queryPin) {
          initialUrl += '&pin=' + encodeURIComponent(queryPin);
        }
      } else if (queryPin) {
        initialUrl += '?pin=' + encodeURIComponent(queryPin);
      }

      makeRequest(initialUrl, 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(true);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function pinRequestFiles(firstAttempt) {
      var pin = prompt(i18n.enterPin + (firstAttempt ? '' : '\n' + i18n.invalidPin));
      if (!pin) {
        document.getElementById('status-text').innerText = i18n.invalidPin;
        return;
      }

      makeRequest(BASE_URL + '/prepare-download?pin=' + encodeURIComponent(pin), 'POST', function (response) {
        if (response.status === 401) {
          pinRequestFiles(false);
          return;
        }

        if (response.status === 403) {
          document.getElementById('status-text').innerText = i18n.rejected;
          return;
        }

        if (response.status === 429) {
          document.getElementById('status-text').innerText = i18n.tooManyAttempts;
          return;
        }

        if (response.status !== 200) {
          document.getElementById('status-text').innerText = 'Error: ' + response.status;
          return;
        }

        handleSuccess(response);
      });
    }

    function makeRequest(url, method, callback) {
      var xhr = new XMLHttpRequest();
      xhr.open(method, url, true);
      xhr.onreadystatechange = function () {
        if (xhr.readyState === 4) {
          callback(xhr);
        }
      };
      xhr.send();
    }

    function fetchI18n(then) {
      makeRequest('/i18n.json', 'GET', function (response) {
        if (response.status !== 200) {
          alert('Could not load translations. Please reload the page to try again.');
          return;
        }
        try {
          i18n = JSON.parse(response.responseText);
        } catch (e) {
          alert('Could not parse translations. Please reload the page to try again.');
          return;
        }
        then();
      });
    }

    function init() {
      fetchI18n(firstRequestFiles);
    }

    function handleSuccess(response) {
      var data = JSON.parse(response.responseText);
      var files = data.files;
      sessionId = data.sessionId;
      sessionStorage.setItem('sessionId', sessionId);

      document.getElementById('status-text').innerText = i18n.files + ' (' + getKeys(data.files).length + ')';

      // Handling file display
      handleFilesDisplay(files, sessionId);
    }

    function handleFilesDisplay(files, sessionId) {
      var fileKeys = getKeys(files);
      allFiles = [];
      for (var i = 0; i < fileKeys.length; i++) {
        var file = files[fileKeys[i]];
        var baseName = baseNameOf(file.fileName);
        allFiles.push({
          id: fileKeys[i],
          name: baseName,
          size: file.size,
          ext: fileExt(baseName),
          url: fileUrl(sessionId, fileKeys[i]),
          selected: false
        });
      }

      selectMode = false;
      document.body.className = '';
      buildGroups();
      renderList();

      // A single file is just clicked to download; selection only matters for several.
      if (allFiles.length > 1) {
        renderToolbar();
      } else {
        document.getElementById('toolbar').innerHTML = '';
      }
    }

    function buildGroups() {
      groups = {};
      for (var i = 0; i < allFiles.length; i++) {
        var ext = allFiles[i].ext;
        if (!groups[ext]) {
          groups[ext] = [];
        }
        groups[ext].push(i);
      }
      groupOrder = getKeys(groups).sort();
      for (var g = 0; g < groupOrder.length; g++) {
        groups[groupOrder[g]].sort(function (a, b) {
          var na = allFiles[a].name.toLowerCase();
          var nb = allFiles[b].name.toLowerCase();
          return na < nb ? -1 : (na > nb ? 1 : 0);
        });
      }
    }

    function rowHtml(i, delay) {
      var f = allFiles[i];
      var cat = extCategory(f.ext);
      return '<a class="file-item" id="file-row-' + i + '" href="' + f.url + '" style="animation-delay:' + delay.toFixed(2) + 's">' +
          '<span class="file-check"><span class="check-box" id="file-box-' + i + '"></span></span>' +
          '<span class="file-icon cat-' + cat + '">' + FILE_ICON + '</span>' +
          '<span class="file-name-cell">' + escapeHtml(f.name) + '</span>' +
          '<span class="file-size-cell">' + formatBytes(f.size) + '</span>' +
          '</a>';
    }

    function renderList() {
      var html = '';
      var delay = 0;
      if (allFiles.length === 1) {
        html = rowHtml(0, delay);
      } else {
        for (var g = 0; g < groupOrder.length; g++) {
          var ext = groupOrder[g];
          var idxs = groups[ext];
          var cat = extCategory(ext);
          html += '<div class="group-header" id="group-head-' + g + '" style="animation-delay:' + delay.toFixed(2) + 's">' +
              '<span class="group-check"><span class="check-box" id="group-box-' + g + '"></span></span>' +
              '<span class="group-title-cell">' +
              '<span class="ext-badge ext-' + cat + ' group-badge">' + escapeHtml(ext) + '</span>' +
              '<span class="group-count">' + idxs.length + '</span>' +
              '</span></div>';
          delay = Math.min(delay + 0.03, 0.3);
          for (var k = 0; k < idxs.length; k++) {
            html += rowHtml(idxs[k], delay);
            delay = Math.min(delay + 0.03, 0.3);
          }
        }
      }
      document.getElementById('file-list').innerHTML = html;

      rowEls = [];
      boxEls = [];
      for (var j = 0; j < allFiles.length; j++) {
        (function (idx) {
          var row = document.getElementById('file-row-' + idx);
          rowEls[idx] = row;
          boxEls[idx] = document.getElementById('file-box-' + idx);
          row.onclick = function () {
            if (selectMode) {
              toggleRow(idx);
              return false;
            }
            // Browse mode: follow the link, which the server serves as an attachment.
          };
        })(j);
      }

      groupHeadEls = {};
      groupBoxEls = {};
      if (allFiles.length > 1) {
        for (var h = 0; h < groupOrder.length; h++) {
          (function (ext, gi) {
            var head = document.getElementById('group-head-' + gi);
            groupHeadEls[ext] = head;
            groupBoxEls[ext] = document.getElementById('group-box-' + gi);
            head.onclick = function () {
              if (selectMode) {
                toggleGroup(ext);
              }
            };
          })(groupOrder[h], h);
        }
      }
    }

    function renderToolbar() {
      var bar = document.getElementById('toolbar');
      if (!selectMode) {
        bar.innerHTML =
            '<button type="button" id="btn-select" class="btn btn-secondary">' + escapeHtml(t('select')) + '</button>' +
            '<button type="button" id="btn-all" class="btn btn-primary">' + escapeHtml(t('downloadAll')) + '</button>';
        document.getElementById('btn-select').onclick = enterSelect;
        document.getElementById('btn-all').onclick = downloadAll;
        return;
      }

      var count = selectedCount();
      var allSelected = count === allFiles.length;
      bar.innerHTML =
          '<button type="button" id="btn-toggle-all" class="btn btn-secondary">' + escapeHtml(allSelected ? t('deselectAll') : t('selectAll')) + '</button>' +
          '<span class="sel-count">' + count + ' / ' + allFiles.length + '</span>' +
          '<button type="button" id="btn-download-sel" class="btn btn-primary"' + (count === 0 ? ' disabled' : '') + '>' + escapeHtml(t('downloadSelected')) + ' (' + count + ')</button>' +
          '<button type="button" id="btn-cancel" class="btn btn-ghost">' + escapeHtml(t('cancel')) + '</button>';
      document.getElementById('btn-toggle-all').onclick = toggleAll;
      document.getElementById('btn-cancel').onclick = cancelSelect;
      var dl = document.getElementById('btn-download-sel');
      dl.disabled = count === 0;
      dl.onclick = downloadSelected;
    }

    function updateRowVisual(idx) {
      var f = allFiles[idx];
      rowEls[idx].className = f.selected ? 'file-item selected' : 'file-item';
      boxEls[idx].innerHTML = f.selected ? '✓' : '';
    }

    function updateGroupVisual(ext) {
      var head = groupHeadEls[ext];
      if (!head) {
        return;
      }
      var idxs = groups[ext];
      var sel = 0;
      for (var k = 0; k < idxs.length; k++) {
        if (allFiles[idxs[k]].selected) {
          sel++;
        }
      }
      var cls = 'group-header';
      if (sel > 0 && sel === idxs.length) {
        cls += ' group-all';
        groupBoxEls[ext].innerHTML = '✓';
      } else if (sel > 0) {
        cls += ' group-partial';
        groupBoxEls[ext].innerHTML = '–';
      } else {
        groupBoxEls[ext].innerHTML = '';
      }
      head.className = cls;
    }

    function refreshGroupVisuals() {
      for (var g = 0; g < groupOrder.length; g++) {
        updateGroupVisual(groupOrder[g]);
      }
    }

    function toggleRow(idx) {
      allFiles[idx].selected = !allFiles[idx].selected;
      updateRowVisual(idx);
      updateGroupVisual(allFiles[idx].ext);
      renderToolbar();
    }

    function toggleGroup(ext) {
      var idxs = groups[ext];
      var sel = 0;
      for (var k = 0; k < idxs.length; k++) {
        if (allFiles[idxs[k]].selected) {
          sel++;
        }
      }
      var target = sel !== idxs.length;
      for (var j = 0; j < idxs.length; j++) {
        allFiles[idxs[j]].selected = target;
        updateRowVisual(idxs[j]);
      }
      updateGroupVisual(ext);
      renderToolbar();
    }

    function selectedCount() {
      var count = 0;
      for (var i = 0; i < allFiles.length; i++) {
        if (allFiles[i].selected) {
          count++;
        }
      }
      return count;
    }

    function enterSelect() {
      selectMode = true;
      document.body.className = 'select-mode';
      renderToolbar();
      refreshGroupVisuals();
    }

    function cancelSelect() {
      selectMode = false;
      document.body.className = '';
      for (var i = 0; i < allFiles.length; i++) {
        allFiles[i].selected = false;
        updateRowVisual(i);
      }
      renderToolbar();
      refreshGroupVisuals();
    }

    function toggleAll() {
      var target = selectedCount() !== allFiles.length;
      for (var i = 0; i < allFiles.length; i++) {
        allFiles[i].selected = target;
        updateRowVisual(i);
      }
      renderToolbar();
      refreshGroupVisuals();
    }

    function downloadAll() {
      var urls = [];
      for (var i = 0; i < allFiles.length; i++) {
        urls.push(allFiles[i].url);
      }
      downloadUrls(urls);
    }

    function downloadSelected() {
      var urls = [];
      for (var i = 0; i < allFiles.length; i++) {
        if (allFiles[i].selected) {
          urls.push(allFiles[i].url);
        }
      }
      downloadUrls(urls);
    }

    function downloadUrls(urls) {
      if (!urls.length) {
        return;
      }
      // One download per second: browsers may ask for permission to
      // download multiple files, and the sender resolves each file lazily.
      for (var j = 0; j < urls.length; j++) {
        (function (url, delay) {
          setTimeout(function () {
            triggerDownload(url);
          }, delay);
        })(urls[j], j * 1000);
      }
    }

    function extCategory(ext) {
      return EXT_CAT[String(ext).toLowerCase()] || 'other';
    }

    function baseNameOf(name) {
      var s = String(name === null || name === undefined ? '' : name);
      var slash = s.lastIndexOf('/');
      var back = s.lastIndexOf('\\');
      var cut = slash > back ? slash : back;
      return cut >= 0 ? s.substring(cut + 1) : s;
    }

    function fileExt(name) {
      var idx = name.lastIndexOf('.');
      if (idx <= 0 || idx === name.length - 1) {
        return 'FILE';
      }
      return name.substring(idx + 1).toUpperCase();
    }

    function fileUrl(sessionId, fileId) {
      return BASE_URL + '/download?sessionId=' + encodeURIComponent(sessionId) + '&fileId=' + encodeURIComponent(fileId);
    }

    function triggerDownload(url) {
      // A hidden iframe starts the download without leaving this page.
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = url;
      document.body.appendChild(iframe);
      setTimeout(function () {
        if (iframe.parentNode) {
          iframe.parentNode.removeChild(iframe);
        }
      }, 60000);
    }

    function escapeHtml(text) {
      if (text === null || text === undefined) {
        return '';
      }
      var map = {
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      };
      return String(text).replace(/[&<>"']/g, function (m) { return map[m]; });
    }

    function formatBytes(bytes) {
      if (bytes < 1024) {
        return bytes + ' B';
      } else if (bytes < 1024 * 1024) {
        return (bytes / 1024).toFixed(1) + ' KB';
      } else if (bytes < 1024 * 1024 * 1024) {
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      } else {
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
      }
    }

    function getKeys(obj) {
      var keys = [];
      for (var key in obj) {
        keys.push(key);
      }
      return keys;
    }
