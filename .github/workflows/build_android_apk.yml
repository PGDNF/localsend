name: Build Android APK

on:
  workflow_dispatch:
  workflow_call:

env:
  FLUTTER_VERSION: "3.47.9"
  APK_BUILD_DIR: "/tmp/build"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build_apk:
    needs: build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove proprietary dependencies
        run: sh support/scripts/remove_proprietary_dependencies.sh

      - name: Copy files to env.APK_BUILD_DIR
        run: |
          mkdir -p $APK_BUILD_DIR
          cp -r . $APK_BUILD_DIR

      # Signing is optional. Without the secrets below, the release APK is signed
      # with the debug key (see app/android/app/build.gradle) so it stays installable.
      - name: Decode key.properties file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_PROPERTIES }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            echo "$ENCODED_STRING" | base64 -di > app/android/key.properties
          else
            echo "ANDROID_KEY_PROPERTIES is not configured. The APK will be signed with the debug key."
          fi

      - name: Decode android-keystore.jks file
        working-directory: ${{ env.APK_BUILD_DIR }}
        env:
          ENCODED_STRING: ${{ secrets.ANDROID_KEY_STORE }}
        run: |
          if [ -n "$ENCODED_STRING" ]; then
            mkdir -p secrets
            echo "$ENCODED_STRING" | base64 -di > secrets/android-keystore.jks
          else
            echo "ANDROID_KEY_STORE is not configured. The APK will be signed with the debug key."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable

      - name: Check rust-toolchain.toml
        working-directory: ${{ env.APK_BUILD_DIR }}/packages/localsend_isolates
        run: rustup show

      - name: Dependencies
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter pub get

      # 64-bit ARM only: no armeabi-v7a and no x86_64 APK.
      - name: Build APK
        working-directory: ${{ env.APK_BUILD_DIR }}/app
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Collect APK
        run: |
          mkdir -p dist
          cp "$APK_BUILD_DIR/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" \
             "dist/LocalSend-${{ needs.build.outputs.version }}-android-arm64v8.apk"
          ls -l dist

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: apk-arm64-v8a
          path: dist/*.apk
          if-no-files-found: error
