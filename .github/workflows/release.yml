name: Release Draft

on:
  workflow_dispatch:

jobs:
  # Only the 64-bit ARM Android APK is built. There is no other ABI variant
  # and no build for any other platform.
  build_apk:
    uses: ./.github/workflows/build_android_apk.yml
    secrets: inherit

  release:
    needs:
      - build_apk
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' app/pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Draft release
        id: draft_release
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}

      - name: Download APK
        uses: actions/download-artifact@v7
        with:
          name: apk-arm64-v8a
          path: apk-result

      - name: Upload Release Asset (arm64)
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.draft_release.outputs.upload_url }}
          asset_path: apk-result/LocalSend-${{ steps.get_version.outputs.version }}-android-arm64v8.apk
          asset_name: LocalSend-${{ steps.get_version.outputs.version }}-android-arm64v8.apk
          asset_content_type: application/vnd.android.package-archive
